name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build --workspace=@seat-snaps/api

      - name: Run unit tests
        run: npm test --workspace=@seat-snaps/api

      - name: Run E2E tests
        run: npm run test:e2e --workspace=@seat-snaps/api
