services:
  postgres:
    image: postgres:16-alpine
    container_name: seat-snaps-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: seat_snaps
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seat_snaps"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
