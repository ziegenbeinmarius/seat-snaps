<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" fill="none">
  <!-- Koala sitting on a round event table, holding a retro camera -->

  <!-- === TABLE === -->
  <!-- Table leg -->
  <rect x="185" y="340" width="30" height="60" rx="4" fill="#8B6914"/>
  <!-- Table base -->
  <ellipse cx="200" cy="400" rx="60" ry="12" fill="#7A5C10"/>
  <!-- Table top -->
  <ellipse cx="200" cy="340" rx="90" ry="18" fill="#C4956A"/>
  <ellipse cx="200" cy="336" rx="90" ry="18" fill="#D4A87A"/>
  <!-- Table plate / placemat -->
  <ellipse cx="200" cy="336" rx="65" ry="13" fill="#E8D5B8" opacity="0.5"/>

  <!-- === SEATS around the table === -->
  <circle cx="95" cy="350" r="18" fill="#C4956A" opacity="0.35"/>
  <circle cx="305" cy="350" r="18" fill="#C4956A" opacity="0.35"/>
  <circle cx="120" cy="380" r="16" fill="#C4956A" opacity="0.25"/>
  <circle cx="280" cy="380" r="16" fill="#C4956A" opacity="0.25"/>

  <!-- === KOALA BODY === -->
  <!-- Body (sitting on table) -->
  <ellipse cx="200" cy="290" rx="65" ry="60" fill="#9E9E9E"/>
  <!-- Belly -->
  <ellipse cx="200" cy="300" rx="45" ry="42" fill="#D5D5D5"/>

  <!-- === KOALA LEGS (dangling over table edge) === -->
  <ellipse cx="170" cy="335" rx="22" ry="14" fill="#9E9E9E"/>
  <ellipse cx="230" cy="335" rx="22" ry="14" fill="#9E9E9E"/>
  <!-- Feet pads -->
  <ellipse cx="165" cy="340" rx="10" ry="6" fill="#787878"/>
  <ellipse cx="235" cy="340" rx="10" ry="6" fill="#787878"/>

  <!-- === KOALA ARMS (holding camera) === -->
  <!-- Left arm -->
  <path d="M155 270 Q130 280 140 310 Q145 320 160 315" fill="#9E9E9E" stroke="#8A8A8A" stroke-width="1"/>
  <!-- Right arm -->
  <path d="M245 270 Q270 280 260 310 Q255 320 240 315" fill="#9E9E9E" stroke="#8A8A8A" stroke-width="1"/>
  <!-- Left paw -->
  <ellipse cx="155" cy="312" rx="12" ry="8" fill="#787878"/>
  <!-- Right paw -->
  <ellipse cx="245" cy="312" rx="12" ry="8" fill="#787878"/>

  <!-- === RETRO CAMERA === -->
  <rect x="160" y="290" width="80" height="40" rx="8" fill="#3D3D3D"/>
  <rect x="162" y="292" width="76" height="36" rx="6" fill="#4A4A4A"/>
  <!-- Lens -->
  <circle cx="200" cy="310" r="14" fill="#2A2A2A"/>
  <circle cx="200" cy="310" r="10" fill="#1A1A1A"/>
  <circle cx="200" cy="310" r="6" fill="#3A5A8C"/>
  <circle cx="200" cy="310" r="3" fill="#5A8AC0"/>
  <!-- Lens reflection -->
  <circle cx="197" cy="307" r="1.5" fill="white" opacity="0.7"/>
  <!-- Viewfinder -->
  <rect x="218" y="286" width="18" height="10" rx="3" fill="#3D3D3D"/>
  <rect x="220" y="288" width="14" height="6" rx="2" fill="#555"/>
  <!-- Flash -->
  <rect x="165" y="284" width="14" height="8" rx="2" fill="#E8D5B8"/>
  <!-- Shutter button -->
  <circle cx="230" cy="288" r="4" fill="#C4956A"/>

  <!-- === CAMERA FLASH EFFECT === -->
  <circle cx="200" cy="310" r="20" fill="white" opacity="0.08"/>

  <!-- === KOALA HEAD === -->
  <circle cx="200" cy="195" r="62" fill="#9E9E9E"/>

  <!-- === EARS === -->
  <!-- Left ear -->
  <circle cx="148" cy="155" r="30" fill="#9E9E9E"/>
  <circle cx="148" cy="155" r="18" fill="#D5D5D5"/>
  <!-- Right ear -->
  <circle cx="252" cy="155" r="30" fill="#9E9E9E"/>
  <circle cx="252" cy="155" r="18" fill="#D5D5D5"/>

  <!-- === FACE === -->
  <!-- Face mask (lighter area) -->
  <ellipse cx="200" cy="210" rx="40" ry="35" fill="#D5D5D5"/>

  <!-- Eyes -->
  <ellipse cx="182" cy="195" rx="8" ry="9" fill="#2A2A2A"/>
  <ellipse cx="218" cy="195" rx="8" ry="9" fill="#2A2A2A"/>
  <!-- Eye shine -->
  <circle cx="185" cy="192" r="3" fill="white"/>
  <circle cx="221" cy="192" r="3" fill="white"/>

  <!-- Nose -->
  <ellipse cx="200" cy="215" rx="12" ry="8" fill="#4A4A4A"/>
  <ellipse cx="200" cy="213" rx="4" ry="2" fill="#6A6A6A" opacity="0.5"/>

  <!-- Mouth -->
  <path d="M194 222 Q200 228 206 222" stroke="#4A4A4A" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Subtle blush -->
  <circle cx="170" cy="212" r="8" fill="#C4956A" opacity="0.2"/>
  <circle cx="230" cy="212" r="8" fill="#C4956A" opacity="0.2"/>
</svg>
