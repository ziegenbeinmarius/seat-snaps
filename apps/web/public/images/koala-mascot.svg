<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" fill="none">
  <!-- PostHog-inspired flat illustration koala with retro camera -->
  <!-- Clean shapes, bold fills, expressive personality -->

  <!-- === BODY === -->
  <ellipse cx="160" cy="260" rx="58" ry="55" fill="#8C8C8C"/>
  <!-- Belly -->
  <ellipse cx="160" cy="268" rx="40" ry="38" fill="#E8E8E8"/>

  <!-- === FEET (sitting pose, dangling) === -->
  <ellipse cx="130" cy="310" rx="20" ry="10" fill="#8C8C8C"/>
  <ellipse cx="190" cy="310" rx="20" ry="10" fill="#8C8C8C"/>
  <!-- Foot pads -->
  <ellipse cx="128" cy="314" rx="9" ry="5" fill="#6B6B6B"/>
  <ellipse cx="192" cy="314" rx="9" ry="5" fill="#6B6B6B"/>

  <!-- === ARMS (holding camera up with enthusiasm) === -->
  <!-- Left arm -->
  <path d="M115 238 Q90 245 100 275 Q104 285 118 280" fill="#8C8C8C"/>
  <circle cx="112" cy="278" r="8" fill="#6B6B6B"/>
  <!-- Right arm -->
  <path d="M205 238 Q230 245 220 275 Q216 285 202 280" fill="#8C8C8C"/>
  <circle cx="208" cy="278" r="8" fill="#6B6B6B"/>

  <!-- === RETRO CAMERA (held in front) === -->
  <!-- Camera body -->
  <rect x="125" y="260" width="70" height="36" rx="6" fill="#3D3D3D"/>
  <rect x="127" y="262" width="66" height="32" rx="5" fill="#505050"/>
  <!-- Camera grip stripe -->
  <rect x="127" y="280" width="66" height="4" fill="#3D3D3D" opacity="0.3"/>
  <!-- Lens housing -->
  <circle cx="160" cy="278" r="13" fill="#2A2A2A"/>
  <circle cx="160" cy="278" r="10" fill="#1A1A1A"/>
  <!-- Lens glass -->
  <circle cx="160" cy="278" r="7" fill="#3A6B9F"/>
  <circle cx="160" cy="278" r="4" fill="#5A9DD0"/>
  <!-- Lens reflection -->
  <circle cx="157" cy="275" r="2" fill="white" opacity="0.6"/>
  <!-- Flash unit -->
  <rect x="130" y="254" width="14" height="8" rx="2" fill="#F0D9B5"/>
  <rect x="131" y="255" width="12" height="6" rx="1.5" fill="#FFE8C8"/>
  <!-- Viewfinder -->
  <rect x="173" y="256" width="16" height="9" rx="2.5" fill="#3D3D3D"/>
  <rect x="175" y="258" width="12" height="5" rx="1.5" fill="#666"/>
  <!-- Shutter button -->
  <circle cx="185" cy="257" r="3.5" fill="#C4956A"/>
  <circle cx="185" cy="256.5" r="2.5" fill="#D4A87A"/>

  <!-- === CAMERA STRAP (hanging from neck) === -->
  <path d="M130 255 Q130 230 140 220" stroke="#C4956A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M190 255 Q190 230 180 220" stroke="#C4956A" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- === HEAD === -->
  <circle cx="160" cy="165" r="58" fill="#8C8C8C"/>

  <!-- === EARS (big, fluffy — signature koala) === -->
  <!-- Left ear outer -->
  <circle cx="110" cy="125" r="30" fill="#8C8C8C"/>
  <!-- Left ear fluffy tufts -->
  <circle cx="105" cy="115" r="20" fill="#A8A8A8"/>
  <circle cx="110" cy="125" r="18" fill="#E8E8E8"/>
  <!-- Right ear outer -->
  <circle cx="210" cy="125" r="30" fill="#8C8C8C"/>
  <!-- Right ear fluffy tufts -->
  <circle cx="215" cy="115" r="20" fill="#A8A8A8"/>
  <circle cx="210" cy="125" r="18" fill="#E8E8E8"/>

  <!-- === FACE === -->
  <!-- Face mask -->
  <ellipse cx="160" cy="178" rx="38" ry="32" fill="#E8E8E8"/>

  <!-- Eyebrows (excited/happy) -->
  <path d="M133 152 Q139 146 146 150" stroke="#5A5A5A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M174 150 Q181 146 187 152" stroke="#5A5A5A" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Eyes (big, expressive — PostHog style) -->
  <ellipse cx="145" cy="165" rx="10" ry="11" fill="#2A2A2A"/>
  <ellipse cx="175" cy="165" rx="10" ry="11" fill="#2A2A2A"/>
  <!-- Eye whites / shine (big for personality) -->
  <circle cx="148" cy="161" r="4" fill="white"/>
  <circle cx="178" cy="161" r="4" fill="white"/>
  <circle cx="143" cy="168" r="2" fill="white" opacity="0.5"/>
  <circle cx="173" cy="168" r="2" fill="white" opacity="0.5"/>

  <!-- Big koala nose -->
  <ellipse cx="160" cy="186" rx="14" ry="9" fill="#4A4A4A"/>
  <ellipse cx="160" cy="184" rx="5" ry="3" fill="#6B6B6B" opacity="0.5"/>

  <!-- Happy mouth -->
  <path d="M152 194 Q160 202 168 194" stroke="#4A4A4A" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Cheek blush (warm brand tones) -->
  <circle cx="130" cy="182" r="8" fill="#C4956A" opacity="0.25"/>
  <circle cx="190" cy="182" r="8" fill="#C4956A" opacity="0.25"/>

  <!-- === FLASH SPARKLES (camera just clicked!) === -->
  <g opacity="0.6">
    <!-- Star burst -->
    <path d="M80 230 L84 222 L88 230 L80 226 L88 226 Z" fill="#FFD700"/>
    <path d="M240 220 L243 214 L246 220 L240 217 L246 217 Z" fill="#FFD700"/>
    <path d="M100 195 L102 190 L104 195 L100 193 L104 193 Z" fill="#FFD700"/>
    <!-- Sparkle dots -->
    <circle cx="75" cy="210" r="2" fill="#FFD700"/>
    <circle cx="248" cy="240" r="2" fill="#FFD700"/>
    <circle cx="92" cy="250" r="1.5" fill="#FFD700"/>
    <circle cx="230" cy="200" r="1.5" fill="#FFD700"/>
  </g>
</svg>
