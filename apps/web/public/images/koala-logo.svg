<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Minimal koala face logomark -->
  <!-- Head -->
  <circle cx="20" cy="22" r="13" fill="#8C8C8C"/>
  <!-- Left ear -->
  <circle cx="10" cy="12" r="7" fill="#8C8C8C"/>
  <circle cx="10" cy="12" r="4" fill="#E8E8E8"/>
  <!-- Right ear -->
  <circle cx="30" cy="12" r="7" fill="#8C8C8C"/>
  <circle cx="30" cy="12" r="4" fill="#E8E8E8"/>
  <!-- Face -->
  <ellipse cx="20" cy="25" rx="8.5" ry="7" fill="#E8E8E8"/>
  <!-- Eyes -->
  <circle cx="16" cy="22" r="2.5" fill="#2A2A2A"/>
  <circle cx="24" cy="22" r="2.5" fill="#2A2A2A"/>
  <circle cx="16.8" cy="21.2" r="1" fill="white"/>
  <circle cx="24.8" cy="21.2" r="1" fill="white"/>
  <!-- Nose -->
  <ellipse cx="20" cy="27" rx="3.5" ry="2.2" fill="#4A4A4A"/>
</svg>
